<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLONY REGISTER — Kerbol System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<header>
  <button class="icon-btn" id="btn-left-toggle" aria-label="Toggle systems panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-text">KOLONY REGISTER<small>KERBOL SYSTEM SETTLEMENT TRACKING</small></div>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btn-right-toggle" aria-label="Toggle colony list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18"/></svg>
  </button>
</header>

<div class="layout">

  <!-- LEFT PANEL: system navigation -->
  <div class="panel left" id="panel-left">
    <div class="panel-section">
      <div class="panel-label">System Map</div>
      <div id="schematic-wrap"><svg id="schematic" viewBox="0 0 250 96"></svg></div>
    </div>
    <div class="panel-section" style="border-bottom:none;">
      <div class="panel-label">Celestial Bodies</div>
      <div id="tree"></div>
    </div>
  </div>

  <!-- CENTER: 3D viewport -->
  <div class="viewport" id="viewport">
    <canvas id="three-canvas"></canvas>
    <div id="context-label-layer"></div>
    <div id="marker-layer"></div>

    <div class="viewport-hud">
      <div class="body-card">
        <div class="b-type" id="card-type">PLANET</div>
        <h2 id="card-name">—</h2>
        <div class="b-stats">
          <div><div class="b-stat-label">Radius</div><div class="b-stat-val" id="card-radius">—</div></div>
          <div><div class="b-stat-label">Orbits</div><div class="b-stat-val" id="card-orbits">—</div></div>
          <div><div class="b-stat-label">Distance</div><div class="b-stat-val" id="card-dist">—</div></div>
          <div><div class="b-stat-label">Kolonies</div><div class="b-stat-val" id="card-kolonies">—</div></div>
        </div>
      </div>
    </div>

    <div class="viewport-hint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom</div>
  </div>

  <!-- RIGHT PANEL: colony list / political entities -->
  <div class="panel right" id="panel-right">
    <div class="panel-tabs">
      <div class="panel-tab active" id="tab-kolonies">Kolonies</div>
      <div class="panel-tab" id="tab-owners">Entities</div>
    </div>
    <div id="right-kolonies-view">
      <div class="panel-section">
        <div class="colony-header">
          <div><span class="colony-count" id="colony-count">0</span><small>ON <span id="colony-body-name">—</span></small></div>
        </div>
        <div class="colony-sub" id="colony-sub">Loaded from the connected Google Sheet.</div>
      </div>
      <div id="colony-list"></div>
    </div>
    <div id="right-owners-view" style="display:none;">
      <div class="owners-sub" id="owners-sub">0 political entities recorded.</div>
      <div id="owners-list"></div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script src="static/js/app.js"></script>
</body>
</html>
