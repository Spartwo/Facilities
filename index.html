<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FACILITY REGISTER — Kerbol System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<header>
  <button class="icon-btn" id="btn-left-toggle" aria-label="Toggle systems panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="brand">
    <span class="brand-prompt">&gt;<span class="cursor-blink">_</span></span>
    <div class="brand-text">FACILITY REGISTER<small>KERBOL SYSTEM SETTLEMENT TRACKING</small></div>
  </div>
  <div class="spacer"></div>
  <div class="status-led"><span class="dot"></span>LINK OK</div>
  <button class="icon-btn" id="btn-right-toggle" aria-label="Toggle facility list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18"/></svg>
  </button>
</header>
<div class="term-rule"></div>

<div class="layout">

  <!-- LEFT PANEL: system navigation -->
  <div class="panel left" id="panel-left">
    <div class="panel-section">
      <div class="panel-label">System Map</div>
      <div id="schematic-wrap"><svg id="schematic" viewBox="0 0 250 96"></svg></div>
    </div>
    <div class="panel-section" style="border-bottom:none;">
      <div class="panel-label">Celestial Bodies</div>
      <div id="tree"></div>
    </div>
  </div>

  <!-- CENTER: 3D viewport -->
  <div class="viewport" id="viewport">
    <canvas id="three-canvas"></canvas>
    <div id="context-label-layer"></div>
    <div id="marker-layer"></div>

    <div class="viewport-hud">
      <div class="body-card">
        <div class="b-type" id="card-type">PLANET</div>
        <h2 id="card-name">—</h2>
        <div class="b-stats">
          <div><div class="b-stat-label">Radius</div><div class="b-stat-val" id="card-radius">—</div></div>
          <div><div class="b-stat-label">Orbits</div><div class="b-stat-val" id="card-orbits">—</div></div>
          <div><div class="b-stat-label">Distance</div><div class="b-stat-val" id="card-dist">—</div></div>
          <div><div class="b-stat-label">Facilities</div><div class="b-stat-val" id="card-facilities">—</div></div>
        </div>
      </div>
    </div>

    <div class="viewport-hint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom</div>
  </div>

  <!-- RIGHT PANEL: facility list / political entities -->
  <div class="panel right" id="panel-right">
    <div class="panel-tabs">
      <div class="panel-tab active" id="tab-facilities">Facilities</div>
      <div class="panel-tab" id="tab-owners">Entities</div>
    </div>
    <div id="right-facilities-view">
      <div class="panel-section">
        <div class="facility-header">
          <div><span class="facility-count" id="facility-count">0</span><small>ON <span id="facility-body-name">—</span></small></div>
        </div>
        <div class="facility-sub" id="facility-sub">Loaded from the connected Google Sheet.</div>
      </div>
      <div id="facility-list"></div>
    </div>
    <div id="right-owners-view" style="display:none;">
      <div class="owners-sub" id="owners-sub">0 political entities recorded.</div>
      <div id="owners-list"></div>
    </div>
  </div>

</div>

<div id="toast"></div>
<div id="crt-overlay"></div>

<script src="static/js/01-data.js"></script>
<script src="static/js/02-state.js"></script>
<script src="static/js/03-sheet-api.js"></script>
<script src="static/js/04-utils.js"></script>
<script src="static/js/05-flags.js"></script>
<script src="static/js/06-sidebar.js"></script>
<script src="static/js/07-scene-setup.js"></script>
<script src="static/js/08-terrain.js"></script>
<script src="static/js/09-streaming-imagery.js"></script>
<script src="static/js/10-graticule.js"></script>
<script src="static/js/11-markers.js"></script>
<script src="static/js/12-context-bodies.js"></script>
<script src="static/js/13-scene-loader.js"></script>
<script src="static/js/14-render-loop.js"></script>
<script src="static/js/15-facility-panel.js"></script>
<script src="static/js/16-entities-panel.js"></script>
<script src="static/js/17-body-select.js"></script>
<script src="static/js/18-main.js"></script>
</body>
</html>
